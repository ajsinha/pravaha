[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pravaha"
version = "1.0.1"
description = "Python client SDK for Project Pravaha"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ashutosh Sinha", email = "ajsinha@gmail.com" }]
keywords = ["streaming", "continuous-query", "sql", "aerospike"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
# No required runtime dependencies, deliberately. A client is installed into someone else's
# environment, and every pin it adds is one their resolver has to reconcile. The transport --
# Arrow Flight SQL, per ADR-030 -- arrives behind the "flight" extra, so an application that
# only wants the types never sees pyarrow.
dependencies = []

[project.optional-dependencies]
# The transport, per ADR-030. pyarrow brings Flight and its gRPC underneath, so there is
# no separate grpcio or protobuf pin for a resolver to argue with -- which is most of the
# point of choosing a protocol whose client somebody else maintains.
flight = ["pyarrow>=15.0.0"]
# A JKS or PKCS12 keystore/truststore, for TLS. Separate from "flight" and lazily imported
# by pravaha._keystore only when TlsOptions actually names a keystore: a client that only
# ever configures PEM certificates -- the more universal case -- should not need this pin
# at all. JKS itself needs a JDK's own keytool on the PATH to convert to PKCS12 first; that
# is not a package pin, it is the same assumption the feature makes everywhere else --
# keystore support is for a JVM shop, which already has one.
tls-keystore = ["cryptography>=41.0.0"]
# "build" is here because `./mvnw -Ppython verify` packages a wheel; without it the
# reactor fails at the packaging step in an environment where every test passed.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=2.3,<2.4",
  "ruff>=0.16,<0.17",
  "pyarrow>=15.0.0",
  "cryptography>=41.0.0",
  "build>=1.2",
]

# The command line (docs/guides/CLI.md). Standard library plus this package; the Flight commands need
# the "flight" extra and say so by name when it is missing, the HTTP ones never do.
[project.scripts]
pravaha = "pravaha.cli:run"

# The assistant's model providers (ADR-058). Discovered through this group, so a provider is a
# package: another distribution declares `acme = "acme_pravaha:AcmeProvider"` under the same
# group and `pravaha assist providers` lists it. The built-ins are declared here the same way
# (pravaha.assist.registry also names them, for a source checkout with no installed metadata).
# All five are standard library only: none adds a dependency.
[project.entry-points."pravaha.assist.providers"]
fake = "pravaha.assist.providers.fake:FakeProvider"
anthropic = "pravaha.assist.providers.anthropic:AnthropicProvider"
openai = "pravaha.assist.providers.openai:OpenAIProvider"
openai-compatible = "pravaha.assist.providers.openai:OpenAICompatibleProvider"
ollama = "pravaha.assist.providers.ollama:OllamaProvider"

[project.urls]
Homepage = "https://github.com/ajsinha/pravaha"

[tool.hatch.build.targets.wheel]
packages = ["pravaha"]

# PEP 561. Without this marker every integrator who runs mypy gets "module is installed but
# missing library stubs" for our own SDK and has to silence it -- which is the published
# client telling its users that its type hints are decoration. The hints were already here;
# this is what makes them usable.
[tool.setuptools.package-data]
# The assistant's prompts and dialect card are package resources, read with importlib.resources.
# (Hatchling, the build backend, ships every file under pravaha/ already; this says so for
# anything that builds with setuptools instead.)
pravaha = ["py.typed", "assist/resources/*.json", "assist/resources/prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Named rather than inherited: ruff widened its default rule set in a later release, and CI, which
# installs the newest ruff, went red on code nothing had changed. These are the rules this SDK is
# held to; widening them is a decision, taken here.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture shared by importing it is then "redefined" by every test that takes it as a
# parameter, which is how a fixture is used; F811 reads that as a mistake.
"tests/*" = ["F811"]

[tool.mypy]
# 3.10, not the 3.9 the package runs on: mypy 2 checks against 3.10 and newer only. ruff's
# target-version above still holds the source to 3.9 syntax.
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# pyarrow ships no type information.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
