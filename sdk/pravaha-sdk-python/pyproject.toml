[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pravaha"
version = "0.1.0"
description = "Python client SDK for Project Pravaha"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ashutosh Sinha", email = "ajsinha@gmail.com" }]
keywords = ["streaming", "continuous-query", "sql", "aerospike"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
# No required runtime dependencies, deliberately. A client is installed into someone else's
# environment, and every pin it adds is one their resolver has to reconcile. The transport --
# Arrow Flight SQL, per ADR-030 -- arrives behind the "flight" extra, so an application that
# only wants the types never sees pyarrow.
dependencies = []

[project.optional-dependencies]
# The transport, per ADR-030. pyarrow brings Flight and its gRPC underneath, so there is
# no separate grpcio or protobuf pin for a resolver to argue with -- which is most of the
# point of choosing a protocol whose client somebody else maintains.
flight = ["pyarrow>=15.0.0"]
# "build" is here because `./mvnw -Ppython verify` packages a wheel; without it the
# reactor fails at the packaging step in an environment where every test passed.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.8", "ruff>=0.4", "pyarrow>=15.0.0", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/ajsinha/pravaha"

[tool.hatch.build.targets.wheel]
packages = ["src/pravaha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
