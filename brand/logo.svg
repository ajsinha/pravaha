<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64"
     role="img" aria-label="Pravaha — Ask once. Answer always.">
  <title>Pravaha — Ask once. Answer always.</title>
  <defs>
    <linearGradient id="pravaha-logo-flow" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%"   stop-color="#0A5C5B"/>
      <stop offset="55%"  stop-color="#0E7C7B"/>
      <stop offset="100%" stop-color="#37B0A8"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#pravaha-logo-flow)" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M2,18 Q14,6 26,18 T50,18" opacity="0.55"/>
    <path d="M2,32 Q14,20 26,32 T50,32"/>
    <path d="M2,46 Q14,34 26,46 T50,46" opacity="0.55"/>
  </g>

  <!--
    Set in a system stack rather than converted to outlines, so the file stays editable and
    small. Convert to paths before using it anywhere the rendering environment is unknown.
  -->
  <text x="68" y="38"
        font-family="'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,-apple-system,sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.4" fill="currentColor">PRAVAHA</text>
  <text x="69" y="52"
        font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="8.5" letter-spacing="1.6" fill="currentColor" opacity="0.62">ASK ONCE. ANSWER ALWAYS.</text>
</svg>
