name: fast

# The inner-loop gate. Budget: 6 minutes (implementation plan section 5.1). If this gets slow,
# people stop waiting for it, and a check nobody waits for is not a check.
#
# HAS THIS EVER RUN? Not as a GitHub Actions workflow -- this repository's CI is not exercised.
# Its command, `./mvnw verify -DskipITs`, is the build the development machine runs constantly,
# so what is unproven here is the runner and the cache, not the build.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify the wrapper is the one we vendored
        run: ./mvnw --version

      - name: Format, static analysis, unit and property tests
        run: ./mvnw -B -T1C clean verify -DskipITs

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  # The Error Prone ratchet (ERRORPRONE-2, TESTING.md "Static analysis"). Every check Error Prone
  # enables at WARNING is an ERROR under -Pep in every module but pravaha-api and the Java SDKs, so a
  # new warning fails here. NullAway runs at ERROR in every module (ep.nullaway.level). Main and test code: test-compile,
  # not compile, because half the findings so far were in tests.
  errorprone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Error Prone and NullAway at ERROR
        run: ./mvnw -B -Pep -DskipTests clean test-compile
