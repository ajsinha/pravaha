name: matrix

# HAS THIS EVER RUN? Not as a GitHub Actions workflow. Its commands have run on the development
# machine: the Spring Boot legs, 3.4 and 3.5, ran green on JDK 25 on 2026-10-01 (41 tests each). They are
# written so that a leg CANNOT pass by testing something else -- see BootVersionTest, below.
#
# One JDK: 25 (ADR-061, 2.0). Pravaha 1.x crossed built-with x run-on {21, 25} here, four legs
# with a check that the test run had not recompiled; with Java 25 class files there is no other JDK
# to cross to, so the JDK legs are gone and the one JDK-25 run of the whole reactor is fast.yml's.
# What stays is what still varies: the flagged Agrona memory path and the Spring Boot lines.
on:
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  agrona-flagged:
    name: agrona memory path (flagged)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      # Agrona 2.x reaches jdk.internal.misc.Unsafe. It is never the default for exactly that
      # reason, but the implementation still has to keep working where the flag is available.
      - run: >
          ./mvnw -B clean verify -DskipITs
          -DargLine="--add-exports java.base/jdk.internal.misc=ALL-UNNAMED"

  spring-boot-lines:
    name: starter on Spring Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.4 is the floor from 2.0: Boot 3.2 and 3.3 (Spring Framework 6.0, 6.1) cannot read Java 25
        # class files (ADR-061).
        boot: ['3.4', '3.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      # Each leg is a profile in pravaha-spring-boot-starter's pom, and BootVersionTest fails the leg
      # if the Boot on the test classpath is not the one the profile names -- so a leg cannot pass
      # by quietly testing the default line. Both ran green on the development machine.
      - run: ./mvnw -B -pl pravaha-spring-boot-starter -am verify -DskipITs -Pboot-${{ matrix.boot }}
