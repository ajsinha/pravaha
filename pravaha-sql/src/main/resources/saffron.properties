# Calcite reads this file when CalciteSystemProperty initialises, whatever loads first.
#
# The charset for SQL string literals. Calcite's default is ISO-8859-1, so `WHERE name = '日本語'`
# -- or any literal containing a character above U+00FF -- was refused outright, while the same
# characters as column data worked everywhere. Setting it from a static initialiser in SqlPlanner
# is not enough on its own: if anything touches Calcite before that class loads, the property is
# already resolved and the setting is ignored. That is not hypothetical -- it passed in one test
# run and failed in another, on class-load order alone.
calcite.default.charset=UTF-8
calcite.default.nationalcharset=UTF-8
