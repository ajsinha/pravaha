#
# Tests only. A node keeps its state under pravaha.data.dir (default ./data) since ADR-064; a test context
# started in this module would otherwise write data/ into the source tree. A test that wants persistence
# names a temporary directory for pravaha.data.dir, which wins over this file.
pravaha.data.dir=none
