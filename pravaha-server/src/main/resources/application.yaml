# Engine node configuration.
#
# Only what the HTTP surface needs lives here; engine settings are bound into the engine's own
# immutable Configuration type (design 22.5) so there is one configuration model rather than two.

spring:
  application:
    name: pravaha
  threads:
    virtual:
      # Design 13.2: the control plane is I/O-bound request handling, which is exactly what Loom is
      # for. Lane threads are created by the engine's own pinning factory and are unaffected.
      enabled: true
  mvc:
    problemdetails:
      # Off deliberately: every non-2xx response is an ApiError and nothing else. A client that has
      # to parse two error shapes will handle one of them badly (see ApiExceptionHandler).
      enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Liveness and readiness kept distinct: conflating them makes Kubernetes restart a node that
      # is merely still restoring state (design 26.2).
      probes:
        enabled: true
      # The engine indicator has to be IN the readiness group, or the probe an orchestrator actually
      # polls is not the one that knows whether this node can serve a client. A node with Flight
      # disabled reported UP on all three until the indicator existed, and would have gone on
      # reporting ready without this line.
      # DEGRADED is the engine indicator's answer when a query's source has stopped and every view is
      # still served (FEED-1). Boot ignores a status it has no order for; placed here, the aggregate
      # says DEGRADED and, not being DOWN or OUT_OF_SERVICE, still answers 200.
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
      group:
        readiness:
          include: readinessState,engine
        liveness:
          include: livenessState
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/docs

pravaha:
  node:
    id: pravaha-node-01

  # The wire protocol the SDKs and the CLI speak (ADR-030). The HTTP surface above is for humans
  # and operators; this is for clients.
  # The PostgreSQL wire protocol, read path only. OFF by default.
  #
  # Turning this on lets psql, DBeaver, Grafana and any ORM read a maintained view with no Flight SQL
  # driver, which almost nothing ships. It is a transport and nothing more: the principal reaches the
  # same ViewQuery authorization path and the same audit sink as Flight, so it is not a second, weaker
  # route to the data.
  #
  # IT IS OFF BECAUSE IT IS NEW, not because it cannot be secured: tls.certificate and tls.key below
  # give it TLS, and psql's sslmode=require negotiates over the same port. Left unset the gateway
  # still serves plaintext, and then the password crosses the wire in the clear -- so configure the
  # pair, or run it on loopback or behind a terminator.
  #
  # The two TLS settings are read together and refused together. A key without a certificate, or the
  # reverse, is refused at startup naming the missing one, rather than read into a field and silently
  # ignored -- which is what Flight did before CFG-6(a), serving plaintext while advising the operator
  # to set the very keys they had half-set.
  #
  # Port 5432 is what clients expect and is also what a PostgreSQL server on the same host is already
  # using -- change it rather than fight over it.
  # Written at column zero deliberately. DocumentationFreshnessTest reads a commented key as a
  # declared one, and computes its depth as (spaces before the #) + 1 + (spaces after it) -- which
  # is also where the key lands for anyone who uncomments it by turning the # into a space. So a
  # block indented to match its neighbours visually lands one level too deep and declares
  # pravaha.security.pgwire.* instead of pravaha.pgwire.*. Every commented block in this file is
  # written that way: the streams:, sources: and sinks: blocks below at column zero, and security's
  # tokens: two columns left of its neighbours (it was pravaha.security.allow-anonymous.tokens).
  # Where state goes when a query outgrows memory, instead of being refused (ADR-037 B2).
  #
  # A query whose join or windowed-aggregate state reaches its ceiling is refused today with
  # PRV-4001 and its lane dies. With a directory configured it spills the overflow to disk and keeps
  # running slower instead of stopping. Eviction is deliberately not an option: a retraction whose
  # insert was evicted leaves a row that can never be withdrawn, so spilling is the only correct
  # degradation for a Z-set.
  #
  # Mapped files through java.nio, not an embedded key-value store. No native library, nothing to
  # ship per platform -- the cost ADR-037 warned about, and the same reason the Cassandra driver's
  # JNI was excluded from the bundle.
  #
  # `enabled` is tri-state and explicit wins in BOTH directions: set it false and a directory left
  # configured underneath does NOT switch spilling back on. Leave it unset and a configured
  # directory means on. Every state shape spills, COUNT(DISTINCT) included (ADR-044).
  #
  # max-overflow-slabs: the most overflow slabs ONE state store (a join, a windowed aggregate's
  # accumulators or distinct values) may hold at once. compaction-threshold: once this fraction of
  # a store's carved overflow space is free, its sparse slabs are emptied into the rest and their
  # files truncated and deleted, between batches on the lane thread (ADR-044). 0.5 = compact when
  # half is free; 1.0 = only when a slab is entirely free.
  #
  # max-bytes: the NODE's disk budget for spilled state, across every query (20GB, 512MB, or bytes);
  # 0 = no quota. A query whose state needs a slab past it stops with PRV-4005. Separately, before
  # every slab the directory's free space is checked, and a slab that would not fit is refused with
  # PRV-4006 -- rather than the disk filling inside a write to a mapped file. Both bounds are kept:
  # max-overflow-slabs stops one runaway store taking the whole budget; max-bytes is the budget.
# state:
#   spill:
#     enabled: false
#     directory: ""
#     max-overflow-slabs: 512
#     compaction-threshold: 0.5
#     max-bytes: 0

# pgwire:
#   enabled: false
#   host: 0.0.0.0
#   port: 5432
#   tls:
#     certificate: ""
#     key: ""

  flight:
    enabled: true
    host: 0.0.0.0
    # Without these the transport is grpc+tcp and every row, credential and query travels in clear
    # text. Defensible on a loopback socket and nowhere else: authentication over an unencrypted
    # channel hands the bearer token to anyone on the path. PEM certificate chain and private key.
    tls:
      certificate: ""
      key: ""
    # 9090, because that is what the CLI, both SDKs, every case study and the console already
    # default to. Arrow's registered port is 8815 and using it here would have been defensible in
    # isolation -- and wrong, because a default that disagrees with every example in the repository
    # costs each new user the same twenty minutes.
    port: 9090

  # The streams this node knows about. Until these are in the catalog nothing can be planned
  # against them, and a query naming one is refused with "Object 'txn' not found. Known streams: []"
  # -- accurate, and baffling next to a configuration file that clearly mentions txn.
  #
  # Declaring them here is what lets a node be described by a file. The alternative, and for a long
  # time the only way, is POST /api/v1/streams after every restart.
  #
# streams:
#   txn:
#     schema: "txn_id:INT64,user_id:STRING,amount:INT64,event_time:TIMESTAMP"
#     # The column carrying each row's own time. Without it no watermark advances and no window
#     # ever closes: a windowed query plans, registers, reports RUNNING, ingests every row and
#     # emits nothing, for ever. The name:TYPE grammar has no syntax for marking a column, so
#     # this is the only way to say it from configuration.
#     event-time: event_time
#     # How late THIS stream's rows may be. Lateness belongs to the source, so it is set per
#     # stream. This is the key that is read; pravaha.watermark.out-of-orderness below is not.
#     out-of-orderness: 10s

  # Who may connect, and what they may see.
  #
  # Every mechanism below was built and tested long before it was reachable: mayRead on each view,
  # row filters applied to a read, per-source checks at registration, principals from verified
  # tokens, re-authorization when the journal is replayed. This list used to say "row filters
  # honoured on subscribe"; subscribe is the one path that REFUSES a principal carrying a row
  # filter, deliberately -- reading the view still works and still applies the filter (STRM-13). The node used to construct PERMISSIVE
  # and AuditSink.NONE in its own constructor and never call authenticatedBy at all -- the lock was
  # built and the door was propped open.
  #
  # THE DEFAULTS BELOW REFUSE TO START. That is deliberate. A server that serves every view to
  # every unauthenticated caller is a legitimate way to run an engine behind a boundary that has
  # already authenticated somebody -- and it is not something anybody should get by not reading
  # this file. Pick one of the three:
  #
  #   authentication: token    + tokens below      real credentials
  #   policy: authenticated                        anonymous callers get nothing
  #   allow-anonymous: true                        open, on purpose, written down
  #
  # For a local first run, start with --spring.profiles.active=dev, which is the last of these.
  security:
    # none | token
    authentication: none
    # permissive (everyone sees everything) | authenticated (only verified callers see anything)
    policy: permissive
    # none | memory | file
    #
    # memory keeps recent decisions in this process and exposes them to nothing -- no endpoint, no
    # log, no file. It is for tests and heap dumps, and a node set to it says so at startup.
    # file is the setting that leaves a record an operator can read (CFG-23).
    audit: none
    # Where audit: file writes, as JSON Lines. Created rw------- : it holds every principal id that
    # asked for anything and the SQL they asked with, which is why this is a file and not an
    # endpoint -- the operating system already decides who may read it.
    audit-file: pravaha-audit.jsonl
    # Rotate past this size, keeping this many generations. An audit trail that fills the disk
    # stops the node it was auditing.
    audit-rotate-bytes: 67108864
    audit-keep: 5
    # Acknowledges an open server. Deliberately awkward to set by accident.
    allow-anonymous: false
    # Static credentials, for a development server and a test -- the type is named
    # StaticTokenVerifier so that nobody mistakes it for an identity system. A real deployment
    # implements TokenVerifier against whatever issues its credentials.
    #
  # tokens:
  #   "a-long-random-string":
  #     id: ann
  #     tenant: acme
  #     roles: [reader]

  # Where each stream's rows come from. Without a binding a registered query runs and receives
  # nothing -- correct for an engine an application pushes rows into, and a silent surprise for a
  # server, which is why the node logs which streams are bound at startup.
  #
  # The plugin name is the one the plugin reports for itself, found on the classpath by
  # ServiceLoader. filesystem is inside the server jar; feedfile, jdbc, delta, aerospike, cassandra
  # and postgres-cdc ship as plugin modules in this repository. Options are passed to the plugin
  # untouched.
  #
  # postgres-cdc is the one that is a changelog: a delete arrives as a retraction of the whole old
  # row and an update as a retraction and an insertion (docs/CONTINUOUS_QUERIES.md section 2.1). It
  # leaves a replication slot on the database that retains WAL until a checkpoint confirms it, so
  # set pravaha.checkpoint.directory with it, and read docs/OPERATIONS.md before the first one.
  #
# sources:
#   txn:
#     plugin: filesystem
#     options:
#       path: /var/lib/pravaha/incoming/txn.csv
#       schema: "id:INT64,user_id:STRING,amount:INT64"
#       # Optional. Names a column saying whether a row inserts or retracts. Without one a file is
#       # an append-only log of insertions, which is what it was before this existed -- and the
#       # engine's whole retraction model had no way in from a configured source.
#       op.column: op
#       # The values in that column that mean "retract". Default: D,DELETE,-,-1
#       op.delete.values: "D,DELETE,-,-1"
#   customers:
#     plugin: postgres-cdc
#     options:
#       url: "jdbc:postgresql://db-1:5432/crm?sslmode=verify-full&sslrootcert=/etc/pravaha/db-ca.pem"
#       user: pravaha_cdc                 # REPLICATION role
#       password: "${PRAVAHA_CDC_PASSWORD}"
#       table: public.customers           # must be REPLICA IDENTITY FULL
#       slot: pravaha_customers
#       publication: pravaha_customers
#       heartbeat.interval: 10s           # keeps the slot moving on a quiet table

  # W8-13 (ADR-039 item 5, ADR-043). Names a StreamSinkPlugin the way `sources` above names a
  # StreamSourcePlugin -- same ServiceLoader-by-name() resolution, same plugin/options shape. A
  # binding here does nothing until a registration names it (`pravaha register --sink audit_trail`,
  # or an SDK's register(..., sink)); from then on every commit of that query's view is written to
  # it as well, at least once. A query whose changelog the sink cannot take is refused at
  # registration with PRV-2041, and so is one whose SELECT list is not the binding's `schema` --
  # same order, names and types -- or, for a keyed sink, whose --keys are not its key (PRV-8010).
  # `filesystem` is append-only, non-transactional and not idempotent -- see SinkCapabilities -- so
  # it takes filters, projections and windows without lateness, and nothing that retracts.
  # `aerospike-sink` upserts by key and deletes on a retraction, so it takes anything:
  #   plugin: aerospike-sink
  #   options: {hosts: "aerospike-1:3000", namespace: analytics, set: spend,
  #             schema: "user_id:STRING,total:INT64", key.bins: user_id}
  # `jdbc-sink` maintains the answer in a table you create, upserting and deleting by key.column(s)
  # (or `mode: append`). It is transactional: writes are staged per checkpoint and applied in one
  # database transaction once the checkpoint is durable -- exactly once with
  # pravaha.checkpoint.directory set. TLS goes in the url; tls.* is refused. See OPERATIONS.md.
  #   plugin: jdbc-sink
  #   options: {url: "jdbc:postgresql://pg-1:5432/analytics", user: pravaha, password: "${PG_PASSWORD}",
  #             table: spend, schema: "user_id:STRING,total:INT64", key.columns: user_id}
  # `kafka-sink` writes the changes to a topic you create: keyed JSON upserts with a tombstone for a
  # retraction (`mode: upsert`, key.columns required; compact the topic), or every change with its
  # op and weight (`mode: changelog`). It is transactional through a staging topic: a checkpoint's
  # changes are written to the target in one Kafka transaction once the checkpoint is durable --
  # exactly once to a read_committed consumer. TLS is the shared tls.* options; SASL is user/password.
  #   plugin: kafka-sink
  #   options: {bootstrap.servers: "kafka-1:9092", topic: spend-by-user,
  #             schema: "user_id:STRING,total:INT64", key.columns: user_id}
  #
# sinks:
#   audit_trail:
#     plugin: filesystem
#     options:
#       path: /var/lib/pravaha/outgoing/audit_trail.csv
#       schema: "id:INT64,user_id:STRING,amount:INT64"

  registry:
    # Where registered continuous queries are written down. Unset means they live only in memory and
    # a restart loses them -- which the node warns about at startup rather than leaving to be found
    # out at the next restart. The file holds query text and bound parameter values (account numbers,
    # customer ids), so permission it like data, not like configuration.
    journal: ""

  # Where records this node cannot decode are written, one file per query.
  #
  # Unset means nowhere, and that is the default on purpose. A dead-letter queue keeps two rules
  # that pull against each other -- never drop a record silently, never let one record stop the
  # pipeline -- and without somewhere durable to put the record, "keep going" is just "drop it". So
  # with no queue the source still fails on an undecodable record, loudly.
  #
  # Set it and the other rule applies: the bad record is written here with its bytes and its reason,
  # and the source keeps reading. Before this key existed the engine had the whole mechanism and a
  # server had no way to switch it on, so one malformed field took an entire file to zero rows with
  # the query still reporting RUNNING (TIME-4, W8-11).
  #
  # If this is set and the node cannot write there, it refuses to start (PRV-4090) rather than
  # running without the queue -- which would be the behaviour you configured it to avoid.
  dlq:
    directory: ""

    # How much of each query's file is kept. Past a bound the OLDEST entries are evicted, and the
    # loss is written to <query>.dlq.evicted, warned about in the log, and counted on every surface
    # that shows the queue -- never dropped quietly.
    #
    # Eviction rather than refusal, and that way round on purpose: refusing the newest entry hands
    # IngestPump a queue that has stopped accepting, whose only two remaining moves are to fail the
    # poll (stopping the source, which is what the queue exists to prevent) or to drop the record
    # (the silent loss it exists to prevent) -- and it would keep ten thousand copies of last
    # month's schema change in preference to the record somebody is looking at right now.
    #
    # max-bytes is on by default because a bound that defaults to off is not a bound: the failure
    # it stops is one renamed column in a busy feed filling the disk the checkpoints are on.
    max-bytes: 268435456   # 256 MiB a query; 0 for no byte bound
    max-entries: 0         # the most entries one query's file may hold; 0 is off
    max-age: 0             # how long an entry is kept (30d, PT72H); 0 is off


  # What one registered query costs in memory, and how its lane waits.
  #
  # These existed in the engine and could not be reached from here, which is why eleven error
  # messages told operators to change "arena.slab.size" or "lane.inbox.cell.size" -- neither of
  # which existed (PF-3). The defaults below are the engine's own, so a node that sets nothing
  # behaves exactly as it did.
  #
  # They matter when a node holds many queries, and the measured numbers are worth having here
  # because the obvious guess is wrong. As of W9-6/W9-7, per query (NodeScaleTest):
  #
  #   idle:   1,024 KiB -- the inbox, and nothing else
  #   active: 1,328 KiB -- the inbox plus the pipeline's arena, sized from the plan
  #
  # The arena settings below are NOT where that memory is. The lane's arena measures ZERO for both a
  # projection and a windowed aggregate, because operator output goes to the view rather than
  # through the lane's scratch -- it is allocated lazily and, for these shapes, never at all. It is
  # kept settable because a plan that does write through it (joins, wide fan-out) will, and because
  # the error messages that say "raise pravaha.lane.arena.slab-bytes" have to be able to mean it.
  #
  # What dominates is the inbox: 2048 cells x 512 bytes is a megabyte of burst capacity per query,
  # and a query fed by an Aerospike scan running once a second will never use it. Sized down --
  #
  #   pravaha.lane.inbox.cells: 256
  #   pravaha.lane.inbox.cell-bytes: 256
  #
  # -- that megabyte becomes 64 KiB. One rule when sizing down: a cell must fit the widest row the
  # query will see, because a row that does not fit is refused at ingest rather than buffered.
  #
  # The inbox is per query only because each query has a lane of its own -- unless multiplex is on,
  # below, and then queries share a fixed set of lanes and their inboxes (W9-8).
  #
  # Documented for operators in docs/OPERATIONS.md, "Sizing a node for many queries".
  lane:
    batch-size: 512
    wait-strategy: BACKOFF_PARK
    inbox:
      cells: 2048
      cell-bytes: 512
    arena:
      slab-bytes: 4194304
      max-slabs: 8
    # Registered queries share `lanes` lanes, at most `max-queries-per-lane` to each, instead of
    # holding one lane -- and one inbox -- apiece. OFF by default: a shared lane shares its fate, so
    # a query whose pipeline fails takes every query on its lane down with it.
    #
    # A registration lands on the least loaded shared lane below the ceiling that carries no other
    # query over the same stream (two would each count the other's rows). One that fits nowhere, or
    # that reads more than one stream (a join), gets a lane of its own -- never refused.
    # Zero lanes means one per available processor. Watch pravaha_lane_shared_queries{lane=} and
    # pravaha_lane_own_queries, or the "lanes:" line of the node's status.
    multiplex:
      enabled: false
      lanes: 0
      max-queries-per-lane: 300

  # Whether this node may write state into a directory another node already owns.
  #
  # A node claims its checkpoint directory and its registry journal's directory at startup, writing
  # a .pravaha-owner marker naming itself, its host, its port and its pid, refreshed on a lease. Two
  # nodes sharing one checkpoint root prune each other's checkpoints; two sharing one journal replay
  # each other's registrations and each comes up running queries it never registered. Both were
  # reachable from two lines of this file and neither reported anything (CFG-13, CFG-14).
  #
  # The directory is namespaced by node.id rather than by host and port on purpose: an address
  # identifies a location, a node id identifies a node, and a node restarting on a new pod IP has to
  # find its own checkpoints. The address lives in the marker instead, where it answers the question
  # the node id cannot -- whether the other owner is still running.
  #
  # A node reclaiming its *own* state after a crash does not need this flag; an expired claim under
  # the same node id is taken over automatically. Set it only to let two nodes share on purpose.
  state:
    allow-shared: false

  # A standby holds no lanes and serves nothing until the node it stands by for stops refreshing
  # its ownership claim, then takes over from the newest checkpoint.
  #
  # It is configured with the SAME pravaha.node.id as the primary, on purpose. StateOwnership
  # already distinguishes "our node id, claim expired" -- a crash restart, taken over automatically
  # -- from "our node id, claim live", which is refused. A standby is the first case waited for
  # rather than discovered, so there is one mechanism deciding who owns the state instead of two
  # that can disagree. No consensus, no membership protocol, no Ratis (ADR-035, ADR-034).
  #
  # What a takeover buys is RECOVERY TIME, NOT CONTINUITY. The standby resumes from the newest
  # checkpoint, so everything the primary processed after it is replayed from the source offsets
  # that checkpoint carries -- and anything the source can no longer supply is gone. The promotion
  # log line says so every time, rather than reporting "failover complete" and letting the reader
  # assume otherwise.
  #
  # Needs pravaha.checkpoint.directory: that is what is watched and what is resumed from.
  standby:
    enabled: false

  # What a query had accumulated, so a restart recovers answers and not only questions.
  #
  # The journal above remembers which queries exist; this remembers what they had computed. A node
  # with a journal and no checkpoint directory comes back knowing every question and none of the
  # answers -- which is what this server did, because nothing ever constructed a checkpointer.
  #
  # Unset means no checkpoints, and the node says so at startup rather than leaving it to be
  # discovered during a recovery. Each query checkpoints into its own directory beneath this one:
  # one shared store would make pruning global, so a busy query would evict a quiet one's only
  # fallback.
  checkpoint:
    directory: ""
    interval: 1m
    # Counted, not timed, and deliberately. An age rule would delete the last fallback precisely
    # when nothing is happening: an idle system takes no new checkpoints, so after a quiet night
    # every checkpoint is old and a time rule would remove them all. More than one is kept because
    # the newest is the likeliest to be unreadable -- it is the one being written when a process
    # died.
    keep: 3

  # The time-travel debugger (ADR-048). A session forks a query from one of the checkpoints above
  # and steps it under inspection, with every sink disabled and nothing able to read its view --
  # so it needs pravaha.checkpoint.directory to be set, and refuses with PRV-8011 when it is not.
  #
  # Every setting here is a bound rather than a feature switch. A session is a second copy of a
  # query's state, its lanes and its arena, so the cost of leaving one open is the cost of running
  # the query twice.
  debug:
    sessions:
      # How many sessions this node will hold at once. PRV-8014 past it, naming the ones it holds.
      max: 4
    session:
      # How long a session may go untouched before it is released. Checked on the way in to the
      # next call rather than on a timer of its own, so a node that debugs nothing starts nothing.
      ttl: 15m
      # How many rows one session may consume in total. A session keeps every row it has read so
      # that it can be exported as a fixture, so it is bounded; PRV-8015 past it.
      max-rows: 20000
    step:
      # How many rows one "to the next commit" or "until this predicate holds" step will read
      # before giving up. "Until it happens" over a source with ten million rows is a call that
      # never returns.
      max-rows: 10000

  # Event time. Every bound in the engine is armed by it: a join evicts at the watermark minus
  # its match window, a view forgets past the committed frontier, a window closes when the
  # watermark passes its end. A watermark that does not advance is not a quiet query, it is
  # unbounded state.
  watermark:
    # NOT READ BY ANYTHING (DOCX-6). This key was meant to be the engine-wide default for how late
    # a row may be before the engine stops waiting for it, and no code binds it: proved by
    # experiment, not by grep -- four nodes over the same out-of-order fixture give an identical
    # view at 0s and at 10m here, and different views at 0s and 10m under
    # pravaha.streams.<name>.out-of-orderness, which IS read.
    #
    # Set it per stream instead. It is left here rather than deleted because removing a shipped key
    # and giving it a reader are both decisions with consequences beyond this comment, and a key
    # that silently does nothing is worse documented as absent than as broken.
    #
    # The 10s default itself is real and lives in StreamSchema.DEFAULT_OUT_OF_ORDERNESS: generous
    # for a well-behaved source and mean for a bad one, which is the right way round -- too small
    # silently drops rows as late, too large only costs memory, and the second failure is visible
    # while the first is not.
    out-of-orderness: 10s
    # How long a partition may produce nothing before it stops holding the watermark back. Too
    # long and one quiet partition freezes every window in the query, which presents as a hang
    # rather than an error; too short and a merely slow partition is excluded while it still had
    # rows coming, closing windows early.
    idle-after: 30s
    # How often event time advances. This is also what makes idleness detectable at all: a
    # watermark derived only from arriving rows cannot notice that rows have stopped arriving.
    tick: 1s

  cluster:
    # What is being asked of the cluster (a correctness question).
    #   SINGLE      one node
    #   REPLICATED  several nodes, each holding the whole state
    #   PARTITIONED partitions owned by particular nodes -- requires real consensus, and is refused
    #               by a node today (PRV-9002): nothing yet consumes partition ownership, so the
    #               node would serve every partition while claiming to own some (S-3)
    mode: SINGLE
    # Which coordinator provides it (an operational question).
    #   single     no second node to disagree with
    #   socket     static peers, no external service, CANNOT exclude split-brain
    #   zookeeper  real consensus; needs plugins/pravaha-cluster-zookeeper on the classpath
    # PARTITIONED on a mechanism without consensus is refused at startup (PRV-9002), not warned
    # about: two nodes each believing they own a partition corrupt it silently and durably.
    mechanism: single
