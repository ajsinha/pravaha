# Engine node configuration.
#
# Only what the HTTP surface needs lives here; engine settings are bound into the engine's own
# immutable Configuration type (design 22.5) so there is one configuration model rather than two.

spring:
  application:
    name: pravaha
  threads:
    virtual:
      # Design 13.2: the control plane is I/O-bound request handling, which is exactly what Loom is
      # for. Lane threads are created by the engine's own pinning factory and are unaffected.
      enabled: true
  mvc:
    problemdetails:
      # Off deliberately: every non-2xx response is an ApiError and nothing else. A client that has
      # to parse two error shapes will handle one of them badly (see ApiExceptionHandler).
      enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Liveness and readiness kept distinct: conflating them makes Kubernetes restart a node that
      # is merely still restoring state (design 26.2).
      probes:
        enabled: true
      # The engine indicator has to be IN the readiness group, or the probe an orchestrator actually
      # polls is not the one that knows whether this node can serve a client. A node with Flight
      # disabled reported UP on all three until the indicator existed, and would have gone on
      # reporting ready without this line.
      group:
        readiness:
          include: readinessState,engine
        liveness:
          include: livenessState
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/docs

pravaha:
  node:
    id: pravaha-node-01

  # The wire protocol the SDKs and the CLI speak (ADR-030). The HTTP surface above is for humans
  # and operators; this is for clients.
  flight:
    enabled: true
    host: 0.0.0.0
    # Without these the transport is grpc+tcp and every row, credential and query travels in clear
    # text. Defensible on a loopback socket and nowhere else: authentication over an unencrypted
    # channel hands the bearer token to anyone on the path. PEM certificate chain and private key.
    tls:
      certificate: ""
      key: ""
    # 9090, because that is what the CLI, both SDKs, every case study and the console already
    # default to. Arrow's registered port is 8815 and using it here would have been defensible in
    # isolation -- and wrong, because a default that disagrees with every example in the repository
    # costs each new user the same twenty minutes.
    port: 9090

  # The streams this node knows about. Until these are in the catalog nothing can be planned
  # against them, and a query naming one is refused with "Object 'txn' not found. Known streams: []"
  # -- accurate, and baffling next to a configuration file that clearly mentions txn.
  #
  # Declaring them here is what lets a node be described by a file. The alternative, and for a long
  # time the only way, is POST /api/v1/streams after every restart.
  #
  # streams:
  #   txn:
  #     schema: "txn_id:INT64,user_id:STRING,amount:INT64,event_time:TIMESTAMP"
  #     # The column carrying each row's own time. Without it no watermark advances and no window
  #     # ever closes: a windowed query plans, registers, reports RUNNING, ingests every row and
  #     # emits nothing, for ever. The name:TYPE grammar has no syntax for marking a column, so
  #     # this is the only way to say it from configuration.
  #     event-time: event_time
  #     # How late THIS stream's rows may be. Lateness belongs to the source, so it is set per
  #     # stream. This is the key that is read; pravaha.watermark.out-of-orderness below is not.
  #     out-of-orderness: 10s

  # Who may connect, and what they may see.
  #
  # Every mechanism below was built and tested long before it was reachable: mayRead on each view,
  # row filters applied to a read, per-source checks at registration, principals from verified
  # tokens, re-authorization when the journal is replayed. This list used to say "row filters
  # honoured on subscribe"; subscribe is the one path that REFUSES a principal carrying a row
  # filter, deliberately -- reading the view still works and still applies the filter (STRM-13). The node used to construct PERMISSIVE
  # and AuditSink.NONE in its own constructor and never call authenticatedBy at all -- the lock was
  # built and the door was propped open.
  #
  # THE DEFAULTS BELOW REFUSE TO START. That is deliberate. A server that serves every view to
  # every unauthenticated caller is a legitimate way to run an engine behind a boundary that has
  # already authenticated somebody -- and it is not something anybody should get by not reading
  # this file. Pick one of the three:
  #
  #   authentication: token    + tokens below      real credentials
  #   policy: authenticated                        anonymous callers get nothing
  #   allow-anonymous: true                        open, on purpose, written down
  #
  # For a local first run, start with --spring.profiles.active=dev, which is the last of these.
  security:
    # none | token
    authentication: none
    # permissive (everyone sees everything) | authenticated (only verified callers see anything)
    policy: permissive
    # none | memory
    audit: none
    # Acknowledges an open server. Deliberately awkward to set by accident.
    allow-anonymous: false
    # Static credentials, for a development server and a test -- the type is named
    # StaticTokenVerifier so that nobody mistakes it for an identity system. A real deployment
    # implements TokenVerifier against whatever issues its credentials.
    #
    # tokens:
    #   "a-long-random-string":
    #     id: ann
    #     tenant: acme
    #     roles: [reader]

  # Where each stream's rows come from. Without a binding a registered query runs and receives
  # nothing -- correct for an engine an application pushes rows into, and a silent surprise for a
  # server, which is why the node logs which streams are bound at startup.
  #
  # The plugin name is the one the plugin reports for itself, found on the classpath by
  # ServiceLoader: filesystem, feedfile, jdbc and delta ship in this repository. Options are passed
  # to the plugin untouched.
  #
  # sources:
  #   txn:
  #     plugin: filesystem
  #     options:
  #       path: /var/lib/pravaha/incoming/txn.csv
  #       schema: "id:INT64,user_id:STRING,amount:INT64"
  #       # Optional. Names a column saying whether a row inserts or retracts. Without one a file is
  #       # an append-only log of insertions, which is what it was before this existed -- and the
  #       # engine's whole retraction model had no way in from a configured source.
  #       op.column: op
  #       # The values in that column that mean "retract". Default: D,DELETE,-,-1
  #       op.delete.values: "D,DELETE,-,-1"

  registry:
    # Where registered continuous queries are written down. Unset means they live only in memory and
    # a restart loses them -- which the node warns about at startup rather than leaving to be found
    # out at the next restart. The file holds query text and bound parameter values (account numbers,
    # customer ids), so permission it like data, not like configuration.
    journal: ""


  # What a query had accumulated, so a restart recovers answers and not only questions.
  #
  # The journal above remembers which queries exist; this remembers what they had computed. A node
  # with a journal and no checkpoint directory comes back knowing every question and none of the
  # answers -- which is what this server did, because nothing ever constructed a checkpointer.
  #
  # Unset means no checkpoints, and the node says so at startup rather than leaving it to be
  # discovered during a recovery. Each query checkpoints into its own directory beneath this one:
  # one shared store would make pruning global, so a busy query would evict a quiet one's only
  # fallback.
  # Whether this node may write state into a directory another node already owns.
  #
  # A node claims its checkpoint directory and its registry journal's directory at startup, writing
  # a .pravaha-owner marker naming itself, its host, its port and its pid, refreshed on a lease. Two
  # nodes sharing one checkpoint root prune each other's checkpoints; two sharing one journal replay
  # each other's registrations and each comes up running queries it never registered. Both were
  # reachable from two lines of this file and neither reported anything (CFG-13, CFG-14).
  #
  # The directory is namespaced by node.id rather than by host and port on purpose: an address
  # identifies a location, a node id identifies a node, and a node restarting on a new pod IP has to
  # find its own checkpoints. The address lives in the marker instead, where it answers the question
  # the node id cannot -- whether the other owner is still running.
  #
  # A node reclaiming its *own* state after a crash does not need this flag; an expired claim under
  # the same node id is taken over automatically. Set it only to let two nodes share on purpose.
  # What one registered query costs in memory, and how its lane waits.
  #
  # These existed in the engine and could not be reached from here, which is why five error messages
  # told operators to raise "arena.slab.size" -- a setting that did not exist (PF-3). The defaults
  # below are the engine's own, so a node that sets nothing behaves exactly as it did.
  #
  # They matter when a node holds many queries, and the measured numbers are worth having here
  # because the obvious guess is wrong. As of W9-6/W9-7, per query (NodeScaleTest):
  #
  #   idle:   1,024 KiB -- the inbox, and nothing else
  #   active: 1,328 KiB -- the inbox plus the pipeline's arena, sized from the plan
  #
  # The arena settings below are NOT where that memory is. The lane's arena measures ZERO for both a
  # projection and a windowed aggregate, because operator output goes to the view rather than
  # through the lane's scratch -- it is allocated lazily and, for these shapes, never at all. It is
  # kept settable because a plan that does write through it (joins, wide fan-out) will, and because
  # the error messages that say "raise pravaha.lane.arena.slab-bytes" have to be able to mean it.
  #
  # What dominates is the inbox: 2048 cells x 512 bytes is a megabyte of burst capacity per query,
  # and a query fed by an Aerospike scan running once a second will never use it. Sized down --
  #
  #   pravaha.lane.inbox.cells: 256
  #   pravaha.lane.inbox.cell-bytes: 256
  #
  # -- that megabyte becomes 64 KiB. One rule when sizing down: a cell must fit the widest row the
  # query will see, because a row that does not fit is refused at ingest rather than buffered.
  #
  # The inbox is per query only because each query has a lane of its own. LaneMultiplexer would make
  # many queries share one; W9-8 and W9-10 record what that still needs.
  lane:
    batch-size: 512
    wait-strategy: BACKOFF_PARK
    inbox:
      cells: 2048
      cell-bytes: 512
    arena:
      slab-bytes: 4194304
      max-slabs: 8

  state:
    allow-shared: false

  # A standby holds no lanes and serves nothing until the node it stands by for stops refreshing
  # its ownership claim, then takes over from the newest checkpoint.
  #
  # It is configured with the SAME pravaha.node.id as the primary, on purpose. StateOwnership
  # already distinguishes "our node id, claim expired" -- a crash restart, taken over automatically
  # -- from "our node id, claim live", which is refused. A standby is the first case waited for
  # rather than discovered, so there is one mechanism deciding who owns the state instead of two
  # that can disagree. No consensus, no membership protocol, no Ratis (ADR-035, ADR-034).
  #
  # What a takeover buys is RECOVERY TIME, NOT CONTINUITY. The standby resumes from the newest
  # checkpoint, so everything the primary processed after it is replayed from the source offsets
  # that checkpoint carries -- and anything the source can no longer supply is gone. The promotion
  # log line says so every time, rather than reporting "failover complete" and letting the reader
  # assume otherwise.
  #
  # Needs pravaha.checkpoint.directory: that is what is watched and what is resumed from.
  standby:
    enabled: false

  checkpoint:
    directory: ""
    interval: 1m
    # Counted, not timed, and deliberately. An age rule would delete the last fallback precisely
    # when nothing is happening: an idle system takes no new checkpoints, so after a quiet night
    # every checkpoint is old and a time rule would remove them all. More than one is kept because
    # the newest is the likeliest to be unreadable -- it is the one being written when a process
    # died.
    keep: 3

  # Event time. Every bound in the engine is armed by it: a join evicts at the watermark minus
  # its match window, a view forgets past the committed frontier, a window closes when the
  # watermark passes its end. A watermark that does not advance is not a quiet query, it is
  # unbounded state.
  watermark:
    # NOT READ BY ANYTHING (DOCX-6). This key was meant to be the engine-wide default for how late
    # a row may be before the engine stops waiting for it, and no code binds it: proved by
    # experiment, not by grep -- four nodes over the same out-of-order fixture give an identical
    # view at 0s and at 10m here, and different views at 0s and 10m under
    # pravaha.streams.<name>.out-of-orderness, which IS read.
    #
    # Set it per stream instead. It is left here rather than deleted because removing a shipped key
    # and giving it a reader are both decisions with consequences beyond this comment, and a key
    # that silently does nothing is worse documented as absent than as broken.
    #
    # The 10s default itself is real and lives in StreamSchema.DEFAULT_OUT_OF_ORDERNESS: generous
    # for a well-behaved source and mean for a bad one, which is the right way round -- too small
    # silently drops rows as late, too large only costs memory, and the second failure is visible
    # while the first is not.
    out-of-orderness: 10s
    # How long a partition may produce nothing before it stops holding the watermark back. Too
    # long and one quiet partition freezes every window in the query, which presents as a hang
    # rather than an error; too short and a merely slow partition is excluded while it still had
    # rows coming, closing windows early.
    idle-after: 30s
    # How often event time advances. This is also what makes idleness detectable at all: a
    # watermark derived only from arriving rows cannot notice that rows have stopped arriving.
    tick: 1s

  cluster:
    # What is being asked of the cluster (a correctness question).
    #   SINGLE      one node
    #   REPLICATED  several nodes, each holding the whole state
    #   PARTITIONED partitions owned by particular nodes -- requires real consensus
    mode: SINGLE
    # Which coordinator provides it (an operational question).
    #   single     no second node to disagree with
    #   socket     static peers, no external service, CANNOT exclude split-brain
    #   zookeeper  real consensus; needs plugins/pravaha-cluster-zookeeper on the classpath
    # PARTITIONED on a mechanism without consensus is refused at startup (PRV-9002), not warned
    # about: two nodes each believing they own a partition corrupt it silently and durably.
    mechanism: single
