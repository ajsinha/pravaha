#
# The observability profile's Prometheus: scrape the node and load the rules that ship with it
# (deploy/observability/prometheus/pravaha-rules.yaml, mounted at /etc/prometheus/rules/).
#
# /actuator/prometheus is behind the node's token authentication, so the scrape presents the static
# `prometheus` token tools/docker-env.sh generated into $PRAVAHA_HOME/secrets/prometheus.token.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: pravaha
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/pravaha.token
    static_configs:
      - targets: ["pravaha-server:18080"]
