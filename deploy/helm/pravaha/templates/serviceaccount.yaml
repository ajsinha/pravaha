The node calls no Kubernetes API -- there is no operator, no leader election through the
apiserver, no discovery. So the account exists to be an identity for the cloud IAM annotations a
connector's credentials usually hang off, and its token is not mounted.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pravaha.serviceAccountName" . }}
  labels:
    {{- include "pravaha.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
