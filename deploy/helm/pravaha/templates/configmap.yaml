The node's application.yaml. Mounted at /etc/pravaha/application.yaml, which the image names
second in spring.config.additional-location -- so it overrides the image's own defaults and is
itself overridden by extraEnv.

NOTHING SECRET GOES HERE. A ConfigMap is readable by anything in the namespace that can read
ConfigMaps. Tokens come from auth.existingSecret and are mounted as a separate Spring config
file; TLS material comes from tls.existingSecret and is mounted as files.
*/}}
{{- include "pravaha.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pravaha.fullname" . }}
  labels:
    {{- include "pravaha.labels" . | nindent 4 }}
data:
  application.yaml: |
    # Generated by the pravaha Helm chart from .Values.config. Do not edit in the cluster: the
    # next `helm upgrade` replaces it, and the pod is rolled by the checksum annotation on the
    # StatefulSet, so an edit here survives exactly until somebody upgrades.
    {{- include "pravaha.applicationYaml" . | nindent 4 }}
