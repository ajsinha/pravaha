# The node for the counterparty-exposure study.
#
#   pravaha-server --spring.profiles.active=dev \
#                  --spring.config.additional-location=file:./conf/application.yaml
#
# The jdbc source reads its column types from the database, so there is no second `schema` to keep
# in step here -- but the declaration below must list the polled result column for column, in the
# table's own order, including `value_ns`.
pravaha:
  streams:
    settlement:
      schema: "payment_id:INT64,counterparty_id:STRING,currency:STRING,amount_minor:INT64,direction:STRING,value_time:TIMESTAMP,value_ns:INT64"
      # The hour a payment belongs to is its value time, so that is the stream's event time and
      # that is what the query windows on. Without this declaration no watermark advances over the
      # stream, so no hour can ever close and the view stays empty -- which is why a windowed query
      # over a stream without it is refused at registration.
      event-time: value_time
      # A payment may be booked a minute either side of its value time and still be waited for.
      out-of-orderness: 1m
  sources:
    settlement:
      plugin: jdbc
      options:
        url: "jdbc:postgresql://localhost:5432/pravaha"
        user: pravaha
        password: pravaha
        table: settlement
        # The poll's cursor, and -- this is the part that is easy to get wrong -- the column the
        # source stamps each row's event time with. It must therefore be the same instant the query
        # windows on: `value_ns` is `value_time` in epoch nanoseconds, generated by the database
        # (see data/schema.sql). Polling on `payment_id` would stamp every payment with its own id,
        # which is an instant in 1970, and no hour of 2026 would ever close.
        watermark.column: value_ns
        # A unique integer that breaks ties on the cursor: it gives keyset pagination and offsets
        # that replay exactly.
        key.column: payment_id
        # `value_ns` is derived from `value_time`, which is written when the payment is booked and
        # never updated. Saying so is what lets an aggregate read this source at all: a source that
        # can re-deliver a row it has already delivered would count it twice, and the engine
        # refuses an aggregate over one with PRV-2042.
        watermark.moves.on.update: "false"
        fetch.size: "1000"
        page.clause: "LIMIT ?"
  lookups:
    counterparty:
      plugin: jdbc-lookup
      options:
        url: "jdbc:postgresql://localhost:5432/pravaha"
        user: pravaha
        password: pravaha
        table: counterparty
        key.columns: "counterparty_id"
        pool.size: "8"
        cache.seconds: "60"
