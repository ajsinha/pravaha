stream.order_event.role = source
stream.order_event.fields = order_id:INT64, trader_id:STRING, instrument_id:STRING, side:STRING, qty:INT64, price_minor:INT64, event_type:STRING, event_time:TIMESTAMP
stream.order_event.event-time = event_time

stream.instrument.role = lookup
stream.instrument.fields = instrument_id:STRING, symbol:STRING, asset_class:STRING, tick_minor:INT64
stream.order_event.out-of-orderness = 5s
