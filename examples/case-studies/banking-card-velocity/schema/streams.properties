# stream.<name>.fields = col:TYPE[?] , ...   ("?" means nullable)
# stream.<name>.role   = source | lookup
stream.card_auth.role = source
stream.card_auth.fields = auth_id:STRING, card_id:STRING, merchant_id:STRING, amount_minor:INT64, mcc:INT32, status:STRING, auth_time:TIMESTAMP
stream.card_auth.event-time = auth_time

stream.cardholder.role = lookup
stream.cardholder.fields = card_id:STRING, customer_id:STRING, risk_band:STRING, daily_limit_minor:INT64
stream.card_auth.out-of-orderness = 10s
