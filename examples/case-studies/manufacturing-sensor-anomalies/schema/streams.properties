# stream.<name>.fields = col:TYPE[?] , ...   ("?" means nullable)
# stream.<name>.role   = source | lookup
stream.sensor_reading.role = source
stream.sensor_reading.fields = reading_id:STRING, machine_id:STRING, line_id:STRING, temperature_dc:INT64, vibration_um:INT64, reading_time:TIMESTAMP
stream.sensor_reading.event-time = reading_time
stream.sensor_reading.out-of-orderness = 5s
stream.sensor_reading.allowed-lateness = 30s
