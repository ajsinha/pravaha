# stream.<name>.fields = col:TYPE[?] , ...   ("?" means nullable)
# stream.<name>.role   = source | lookup
# Two sources: the study joins one stream to another, not a stream to a lookup table.
stream.dispatch.role = source
stream.dispatch.fields = shipment_id:STRING, depot:STRING, service:STRING, dispatch_time:TIMESTAMP
stream.dispatch.event-time = dispatch_time

stream.delivery.role = source
stream.delivery.fields = shipment_id:STRING, courier:STRING, delivered_time:TIMESTAMP
stream.delivery.event-time = delivered_time
