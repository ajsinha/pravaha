# stream.<name>.fields = col:TYPE[?] , ...   ("?" means nullable)
# stream.<name>.role   = source | lookup
stream.trade.role = source
stream.trade.fields = trade_id:STRING, product_type:STRING, source_system:STRING, trade_event_id:INT64, trade_time:TIMESTAMP, counterparty_id:STRING, book_id:STRING, trade_json:STRING
stream.trade.event-time = trade_time

stream.counterparty.role = lookup
stream.counterparty.fields = counterparty_id:STRING, legal_name:STRING, country:STRING, lei:STRING

stream.book.role = lookup
stream.book.fields = book_id:STRING, desk:STRING, region:STRING, cost_centre:STRING
stream.trade.out-of-orderness = 10s
