# view.<name> = <sql file in sql/>   -- the continuous query that maintains this view. A file that
# is a CREATE CONTINUOUS QUERY statement carries its own name, key and index.
view.merchant_minute = 01-continuous-merchant-minute.sql
view.declines = 02-continuous-declines.sql
view.cross_border = 03-continuous-cross-border.sql
# view.<name>.keys = the columns each view is keyed by, as python/run.py registers it
view.merchant_minute.keys = window_end, merchant
view.declines.keys = payment_id
view.cross_border.keys = payment_id
