# stream.<name>.fields = col:TYPE[?] , ...   ("?" means nullable)
# stream.<name>.role   = source | lookup
stream.payment.role = source
stream.payment.fields = payment_id:STRING, merchant:STRING, card_country:STRING, amount_minor:INT64, status:STRING, paid_at:TIMESTAMP
stream.payment.event-time = paid_at
stream.payment.out-of-orderness = 5s
