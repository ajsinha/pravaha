# stream.<name>.fields = col:TYPE[?] , ...   ("?" means nullable)
# stream.<name>.role   = source | lookup
# mysql-cdc types the stream from information_schema: VARCHAR is STRING, INT is INT32 and DATETIME
# is TIMESTAMP (read as UTC). These are the columns data/schema.sql creates, in its order.
stream.stock.role = source
stream.stock.fields = sku:STRING, warehouse:STRING, on_hand:INT32, reorder_point:INT32, updated_at:TIMESTAMP
stream.stock.event-time = updated_at
stream.stock.out-of-orderness = 5s
