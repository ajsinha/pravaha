# stream.<name>.fields = col:TYPE[?] , ...   ("?" means nullable)
# stream.<name>.role   = source | lookup
# Two sources: the study joins one stream to another, not a stream to a lookup table.
stream.ad_impression.role = source
stream.ad_impression.fields = impression_id:STRING, campaign_id:STRING, user_id:STRING, placement:STRING, cost_micros:INT64, impression_time:TIMESTAMP
stream.ad_impression.event-time = impression_time

stream.ad_click.role = source
stream.ad_click.fields = click_id:STRING, impression_id:STRING, user_id:STRING, click_time:TIMESTAMP
stream.ad_click.event-time = click_time
