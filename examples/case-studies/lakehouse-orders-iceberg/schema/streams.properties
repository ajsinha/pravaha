# stream.<name>.fields = col:TYPE[?] , ...   ("?" means nullable)
# stream.<name>.role   = source | lookup
stream.order_line.role = source
stream.order_line.fields = order_id:STRING, customer_id:STRING, region:STRING, category:STRING, amount_minor:INT64, ordered_at:TIMESTAMP
stream.order_line.event-time = ordered_at
stream.order_line.out-of-orderness = 1m
stream.order_line.allowed-lateness = 15m
