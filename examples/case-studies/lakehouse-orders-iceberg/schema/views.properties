# view.<name> = <sql file in sql/>   -- the continuous query that maintains this view
view.hourly_revenue = 01-continuous-hourly-revenue.sql
view.category_revenue = 02-continuous-category-revenue.sql
# view.<name>.keys = the columns each view is keyed by, as python/run.py registers it
view.hourly_revenue.keys = window_end, region
view.category_revenue.keys = window_end, category
