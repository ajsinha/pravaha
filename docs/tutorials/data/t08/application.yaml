# Tutorial 8 (docs/tutorials/08-change-data-capture.md): a PostgreSQL table's inserts, updates and
# deletes, from its write-ahead log, as a stream. The node's conf/application.yaml; the stream is
# conf/streams/orders.yaml and the database conf/connectors/shop-postgres.yaml.
pravaha:
  # The slot is confirmed only at checkpoints: without them the database would keep every byte of WAL.
  checkpoint:
    interval: 10s
    keep: 5
