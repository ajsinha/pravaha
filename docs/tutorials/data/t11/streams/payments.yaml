# Tutorial 11 (docs/tutorials/11-governance.md): the node's conf/streams/payments.yaml -- card
# payments from two regions. A relative path is relative to the node's home (PRAVAHA_HOME).
schema: "payment_id:INT64,customer:STRING,region:STRING,card_number:STRING,amount:INT64,event_time:TIMESTAMP"
event-time: event_time
out-of-orderness: 5s
source:
  plugin: filesystem
  options:
    path: data/incoming/payments.csv
    schema: "payment_id:INT64,customer:STRING,region:STRING,card_number:STRING,amount:INT64,event_time:TIMESTAMP"
    skip.header: "true"
    follow: "true"
