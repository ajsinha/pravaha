#
# /actuator/prometheus asks who is asking when sign-in is on: the scrape presents an API key, read
# from a file (written by `pravaha key create`), never written here.
global:
  scrape_interval: 2s                # 15s in production; short here so the tutorial does not wait

rule_files:
  - /etc/prometheus/rules/*.yaml     # deploy/observability/prometheus/pravaha-rules.yaml

scrape_configs:
  - job_name: pravaha
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/pravaha.token
    static_configs:
      - targets: ["localhost:18080"]
