# Tutorial 2 (docs/tutorials/02-windows-and-late-data.md): two smart meters' power readings.
# The node's conf/streams/readings.yaml -- the file name is the stream's name. A relative path is
# relative to the node's home (PRAVAHA_HOME).
schema: "meter_id:STRING,watts:INT64,event_time:TIMESTAMP"
event-time: event_time
# How long a window waits for stragglers before it is published.
out-of-orderness: 10s
# How long after that a straggler may still correct what was published.
allowed-lateness: 2m
source:
  plugin: filesystem
  options:
    path: data/incoming/readings.csv
    schema: "meter_id:STRING,watts:INT64,event_time:TIMESTAMP"
    skip.header: "true"
    follow: "true"
