# Tutorial 2 (docs/tutorials/02-windows-and-late-data.md): two smart meters' power readings.
# The node's conf/application.yaml; a relative path is relative to the node's home (PRAVAHA_HOME).
pravaha:
  streams:
    readings:
      schema: "meter_id:STRING,watts:INT64,event_time:TIMESTAMP"
      event-time: event_time
      # How long a window waits for stragglers before it is published.
      out-of-orderness: 10s
      # How long after that a straggler may still correct what was published.
      allowed-lateness: 2m
  sources:
    readings:
      plugin: filesystem
      options:
        path: data/incoming/readings.csv
        schema: "meter_id:STRING,watts:INT64,event_time:TIMESTAMP"
        event.time: event_time
        skip.header: "true"
        follow: "true"
  sinks:
    # An append-only file: a query whose answer can be corrected cannot write to it (PRV-2041).
    meter_log:
      plugin: filesystem
      options:
        path: data/outgoing/meter_log.csv
        schema: "meter_id:STRING,window_start:TIMESTAMP,window_end:TIMESTAMP,readings:INT64,min_w:INT64,max_w:INT64"
