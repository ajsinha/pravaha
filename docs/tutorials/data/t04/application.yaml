# Tutorial 4 (docs/tutorials/04-following-a-view.md): the PostgreSQL gateway a BI tool reads the view
# through. The node's conf/application.yaml; the stream is conf/streams/txn.yaml.
pravaha:
  pgwire:
    # Read-only, off by default. Loopback until TLS is configured: the password is a credential.
    enabled: true
    host: 127.0.0.1
    port: 5433              # 5432 is usually a real PostgreSQL on the same machine
