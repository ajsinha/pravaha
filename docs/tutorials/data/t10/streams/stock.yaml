# Tutorial 10 (docs/tutorials/10-alerts.md): the node's conf/streams/stock.yaml -- stock levels per
# warehouse. A relative path is relative to the node's home (PRAVAHA_HOME).
schema: "sku:STRING,warehouse:STRING,on_hand:INT64,reorder_point:INT64,event_time:TIMESTAMP,op:STRING"
event-time: event_time
out-of-orderness: 5s
source:
  plugin: filesystem
  options:
    path: data/incoming/stock.csv
    schema: "sku:STRING,warehouse:STRING,on_hand:INT64,reorder_point:INT64,event_time:TIMESTAMP,op:STRING"
    skip.header: "true"
    follow: "true"
    # A line whose op is D withdraws the row it repeats: a stock count changes as a D and an I.
    op.column: op
