# Tutorial 10 (docs/tutorials/10-alerts.md): stock levels per warehouse, a view of what is below its
# reorder point, and the channels an alert on it tells.
# The node's conf/application.yaml; a relative path is relative to the node's home (PRAVAHA_HOME).
pravaha:
  streams:
    stock:
      schema: "sku:STRING,warehouse:STRING,on_hand:INT64,reorder_point:INT64,event_time:TIMESTAMP,op:STRING"
      event-time: event_time
      out-of-orderness: 5s
  sources:
    stock:
      plugin: filesystem
      options:
        path: data/incoming/stock.csv
        schema: "sku:STRING,warehouse:STRING,on_hand:INT64,reorder_point:INT64,event_time:TIMESTAMP,op:STRING"
        event.time: event_time
        skip.header: "true"
        follow: "true"
        # A line whose op is D withdraws the row it repeats: a stock count changes as a D and an I.
        op.column: op
  notifiers:
    # The buyers' webhook: the tutorial's catcher.py on this machine. Signed with HMAC-SHA256 under the
    # key in the file -- a secret is never configuration (PRV-8046 if it is written here).
    buyers:
      plugin: webhook
      options:
        url: http://localhost:18099/hook
        secret-file: conf/hook.secret
        retries: "2"
    # One line per notification in the node's log, under the logger pravaha.alerts.
    ops-log:
      plugin: log
