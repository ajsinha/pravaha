# Tutorial 16 (docs/tutorials/16-ai-in-pravaha.md): card payments from three regions, and the engine's AI
# layer switched on with the deterministic mock provider (conf/ai/mock.yaml): no network, no key.
# The node's conf/application.yaml; a relative path is relative to the node's home (PRAVAHA_HOME).
pravaha:
  streams:
    payments:
      schema: "payment_id:INT64,user_id:STRING,region:STRING,card_number:STRING,amount:INT64,event_time:TIMESTAMP"
      event-time: event_time
      out-of-orderness: 5s
  sources:
    payments:
      plugin: filesystem
      options:
        path: data/incoming/payments.csv
        schema: "payment_id:INT64,user_id:STRING,region:STRING,card_number:STRING,amount:INT64,event_time:TIMESTAMP"
        event.time: event_time
        skip.header: "true"
        follow: "true"
  # A channel for the alert the model drafts: each notification a line in the node's log.
  notifiers:
    ops_log:
      plugin: log
  # Every decision the node makes, to a file and readable with `pravaha audit`: the AI calls among them.
  security:
    audit: file
    audit-file: logs/audit.jsonl
  ai:
    enabled: true                    # off by default: no provider file is read and every AI call is PRV-1080
    default-model: mock/m            # provider/model: the file conf/ai/mock.yaml, its model m
    values: labels-only              # what a model may see of your data: names, types, keys, counts; never a value
    policy:
      per-user-per-minute: 60        # every AI call, per person (PRV-1085)
      # Anything that looks like a card number becomes ••• before a prompt leaves the node.
      mask-patterns: ["\\b\\d{4}-\\d{4}-\\d{4}-\\d{4}\\b"]
      features:
        draft: {roles: [admin]}      # who may have a continuous query drafted (PRV-1084 for anyone else)
