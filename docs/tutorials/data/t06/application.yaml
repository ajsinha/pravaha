# Tutorial 6 (docs/tutorials/06-investigating-an-incident.md): a dead-letter queue, and checkpoints
# often enough to fork the debugger from one a minute ago. The node's conf/application.yaml; the
# stream is conf/streams/txn.yaml. A relative path is relative to the node's home (PRAVAHA_HOME).
pravaha:
  # A record no source can decode is set aside here, one file per query, and the source reads on.
  # Without it the source stops at the first bad line.
  dlq:
    directory: data/dlq
  # Every query keeps a checkpoint every 20 seconds, the newest 30: the debugger forks from them.
  # (Where they go is the data root's convention: data/checkpoints.)
  checkpoint:
    interval: 20s
    keep: 30
  # Per-operator numbers in `pravaha plan` and the console's plan view.
  metrics:
    operators: true
