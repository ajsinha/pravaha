<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <title>Stock alerts from MySQL change data capture</title>
  <style>
    text { font-family: 'Source Sans 3', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1A1A1A; }
    .title { font-family: 'Source Serif 4', 'Charis SIL', Georgia, serif; font-size: 23px; font-weight: 700; }
    .head { font-size: 14.5px; font-weight: 700; }
    .small { font-size: 12.5px; fill: #4A5058; }
    .item { font-size: 13px; }
    .mono { font-family: 'Source Code Pro', 'DejaVu Sans Mono', Consolas, Menlo, monospace; font-size: 12px; }
    .chip { font-family: 'Source Code Pro', 'DejaVu Sans Mono', Consolas, Menlo, monospace; font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .time { font-family: 'Source Code Pro', 'DejaVu Sans Mono', Consolas, Menlo, monospace; font-size: 12px; fill: #4A5058; }
    .deep { font-size: 13px; font-weight: 700; fill: #8A1626; }
  </style>
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A51C30"/></marker>
  </defs>
  <rect width="800" height="560" fill="#F7F5F2"/>
  <text x="40" y="44" class="title">Stock alerts that clear themselves</text>
  <text x="40" y="68" class="small">The retail case study: MySQL read through its binary log by mysql-cdc; nothing polls the table.</text>

  <!-- MySQL -->
  <rect x="24" y="86" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#E3DED7"/>
  <text x="40" y="110" class="head">MySQL</text>
  <text x="40" y="130" class="mono">inventory.stock</text>
  <text x="40" y="158" class="small">tills, goods-in and</text>
  <text x="40" y="174" class="small">merchandising write it</text>
  <text x="40" y="202" class="small">every change lands in the</text>
  <text x="40" y="218" class="small">row-based binary log</text>

  <line x1="226" y1="161" x2="254" y2="161" stroke="#A51C30" stroke-width="1.8" marker-end="url(#aa)"/>

  <!-- cdc -->
  <rect x="260" y="86" width="250" height="150" rx="10" fill="#F6E8EA" stroke="#A51C30" stroke-width="1.5"/>
  <text x="276" y="110" class="head">mysql-cdc, as a replica</text>
  <text x="276" y="140" class="item">INSERT</text><text x="356" y="140" class="small">new row at +1</text>
  <text x="276" y="168" class="item">UPDATE</text><text x="356" y="168" class="small">old row at −1, new at +1</text>
  <text x="276" y="196" class="item">DELETE</text><text x="356" y="196" class="small">old row at −1</text>
  <text x="276" y="224" class="small">whole transactions, exactly once</text>

  <line x1="512" y1="161" x2="540" y2="161" stroke="#A51C30" stroke-width="1.8" marker-end="url(#aa)"/>

  <!-- views -->
  <rect x="546" y="86" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#E3DED7"/>
  <text x="562" y="110" class="head">Two views, keyed</text>
  <text x="562" y="128" class="mono">(sku, warehouse)</text>
  <text x="562" y="158" class="deep">stock_levels</text>
  <text x="562" y="176" class="small">the table, kept current</text>
  <text x="562" y="204" class="deep">low_stock</text>
  <text x="562" y="222" class="mono">on_hand &lt;= reorder_point</text>

  <!-- timeline -->
  <rect x="24" y="254" width="752" height="290" rx="10" fill="#FFFFFF" stroke="#E3DED7"/>
  <text x="40" y="280" class="head">What a subscriber to low_stock receives, one commit per statement</text>
  <line x1="60" y1="400" x2="768" y2="400" stroke="#6B7480" stroke-width="1.6"/>

  <!-- 09:00 +1 -->
  <g>
    <line x1="92" y1="372" x2="92" y2="400" stroke="#A51C30" stroke-width="2"/>
    <rect x="76" y="350" width="32" height="20" rx="4" fill="#A51C30"/><text x="92" y="365" class="chip" text-anchor="middle">+1</text>
    <text x="92" y="318" class="item" text-anchor="middle">sku-400</text>
    <text x="92" y="336" class="small" text-anchor="middle">MAN, 3 ≤ 4</text>
    <text x="92" y="420" class="time" text-anchor="middle">09:00</text>
  </g>
  <!-- 09:05 +1 -->
  <g>
    <line x1="200" y1="372" x2="200" y2="400" stroke="#A51C30" stroke-width="2"/>
    <rect x="184" y="350" width="32" height="20" rx="4" fill="#A51C30"/><text x="200" y="365" class="chip" text-anchor="middle">+1</text>
    <text x="200" y="318" class="item" text-anchor="middle">sku-200</text>
    <text x="200" y="336" class="small" text-anchor="middle">LDN, 7 ≤ 8</text>
    <text x="200" y="420" class="time" text-anchor="middle">09:05</text>
  </g>
  <!-- 09:10 +1 -->
  <g>
    <line x1="308" y1="372" x2="308" y2="400" stroke="#A51C30" stroke-width="2"/>
    <rect x="292" y="350" width="32" height="20" rx="4" fill="#A51C30"/><text x="308" y="365" class="chip" text-anchor="middle">+1</text>
    <text x="308" y="318" class="item" text-anchor="middle">sku-300</text>
    <text x="308" y="336" class="small" text-anchor="middle">LDN, 2 ≤ 5</text>
    <text x="308" y="420" class="time" text-anchor="middle">09:10</text>
  </g>
  <!-- 09:15 nothing -->
  <g>
    <circle cx="416" cy="400" r="6" fill="#FFFFFF" stroke="#6B7480" stroke-width="2"/>
    <text x="416" y="420" class="time" text-anchor="middle">09:15</text>
    <text x="416" y="446" class="small" text-anchor="middle">sku-100 MAN</text>
    <text x="416" y="462" class="small" text-anchor="middle">25 → 22: nothing,</text>
    <text x="416" y="478" class="small" text-anchor="middle">both halves above</text>
  </g>
  <!-- 09:20 -1 -->
  <g>
    <line x1="524" y1="400" x2="524" y2="428" stroke="#293352" stroke-width="2"/>
    <text x="524" y="390" class="time" text-anchor="middle">09:20</text>
    <rect x="508" y="430" width="32" height="20" rx="4" fill="#293352"/><text x="524" y="445" class="chip" text-anchor="middle">−1</text>
    <text x="524" y="470" class="item" text-anchor="middle">sku-200</text>
    <text x="524" y="488" class="small" text-anchor="middle">a delivery:</text>
    <text x="524" y="504" class="small" text-anchor="middle">the alert clears</text>
  </g>
  <!-- 09:25 -1 -->
  <g>
    <line x1="632" y1="400" x2="632" y2="428" stroke="#293352" stroke-width="2"/>
    <text x="632" y="390" class="time" text-anchor="middle">09:25</text>
    <rect x="616" y="430" width="32" height="20" rx="4" fill="#293352"/><text x="632" y="445" class="chip" text-anchor="middle">−1</text>
    <text x="632" y="470" class="item" text-anchor="middle">sku-400</text>
    <text x="632" y="488" class="small" text-anchor="middle">DELETE:</text>
    <text x="632" y="504" class="small" text-anchor="middle">discontinued</text>
  </g>
  <!-- 09:30 +1 -->
  <g>
    <line x1="728" y1="372" x2="728" y2="400" stroke="#A51C30" stroke-width="2"/>
    <rect x="712" y="350" width="32" height="20" rx="4" fill="#A51C30"/><text x="728" y="365" class="chip" text-anchor="middle">+1</text>
    <text x="728" y="318" class="item" text-anchor="middle">sku-100</text>
    <text x="728" y="336" class="small" text-anchor="middle">LDN, 10 ≤ 10</text>
    <text x="728" y="420" class="time" text-anchor="middle">09:30</text>
  </g>
  <text x="40" y="530" class="small">Low in LDN now: sku-100 and sku-300. An alert that clears arrives as a −1.</text>
</svg>
