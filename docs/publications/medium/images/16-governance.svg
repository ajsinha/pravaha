<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <title>Row filters and masks as policies, applied where rows leave an object</title>
  <style>
    text { font-family: 'Source Sans 3', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1A1A1A; }
    .title { font-family: 'Source Serif 4', 'Charis SIL', Georgia, serif; font-size: 23px; font-weight: 700; }
    .head { font-size: 14.5px; font-weight: 700; }
    .small { font-size: 12.5px; fill: #4A5058; }
    .item { font-size: 13px; }
    .mono { font-family: 'Source Code Pro', 'DejaVu Sans Mono', Consolas, Menlo, monospace; font-size: 11.5px; }
    .monow { font-family: 'Source Code Pro', 'DejaVu Sans Mono', Consolas, Menlo, monospace; font-size: 11px; fill: #FFFFFF; }
    .deep { font-size: 13px; font-weight: 700; fill: #8A1626; }
    .inv { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .invs { font-size: 12.5px; fill: #FFFFFF; }
    .code { font-family: 'Source Code Pro', 'DejaVu Sans Mono', Consolas, Menlo, monospace; font-size: 12px; font-weight: 700; fill: #8A1626; }
  </style>
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A51C30"/></marker>
  </defs>
  <rect width="800" height="560" fill="#F7F5F2"/>
  <text x="40" y="44" class="title">Governing an answer that is still being computed</text>
  <text x="40" y="68" class="small">Row filters and column masks are catalogue policies, bound to an object or a tag, and applied</text>
  <text x="40" y="85" class="small">where rows leave the object: before any operator of the reader's query sees them.</text>

  <!-- the object -->
  <rect x="24" y="104" width="190" height="230" rx="10" fill="#FFFFFF" stroke="#E3DED7"/>
  <text x="40" y="128" class="head">payments</text>
  <text x="40" y="146" class="small">a view with an owner</text>
  <text x="40" y="176" class="mono">region   EU</text>
  <text x="40" y="194" class="mono">card     4111…1111</text>
  <text x="40" y="212" class="mono">amount   120</text>
  <text x="40" y="244" class="small">tag: pii</text>
  <text x="40" y="270" class="small">grants: SELECT,</text>
  <text x="40" y="287" class="small">SUBSCRIBE, BUILD_ON,</text>
  <text x="40" y="304" class="small">MODIFY, MANAGE, OWN</text>

  <line x1="216" y1="219" x2="240" y2="219" stroke="#A51C30" stroke-width="1.8" marker-end="url(#aa)"/>

  <!-- the edge -->
  <rect x="246" y="104" width="250" height="230" rx="10" fill="#A51C30"/>
  <text x="262" y="128" class="inv">At the edge of the object</text>
  <text x="262" y="154" class="invs">row filter sales.region_scope</text>
  <text x="262" y="172" class="monow">region =</text>
  <text x="262" y="189" class="monow">  session_attribute('region')</text>
  <text x="262" y="206" class="monow">EXCEPT ROLE finance_admin</text>
  <text x="262" y="232" class="invs">mask sales.card_last4, by tag pii</text>
  <text x="262" y="250" class="monow">'XXXX-' || RIGHT(card, 4)</text>
  <text x="262" y="267" class="monow">EXCEPT ROLE payments_ops</text>
  <text x="262" y="296" class="invs">Filters AND together; an</text>
  <text x="262" y="314" class="invs">EXCEPT ROLE holder is exempt.</text>

  <line x1="498" y1="219" x2="522" y2="219" stroke="#A51C30" stroke-width="1.8" marker-end="url(#aa)"/>

  <!-- the readers -->
  <rect x="528" y="104" width="248" height="230" rx="10" fill="#F6E8EA" stroke="#A51C30" stroke-width="1.5"/>
  <text x="544" y="128" class="deep">Every way rows leave</text>
  <text x="544" y="154" class="item">Flight SQL scans and point reads</text>
  <text x="544" y="180" class="item">pgwire: psql, Power BI, psycopg</text>
  <text x="544" y="206" class="item">subscriptions: snapshot, commits</text>
  <text x="544" y="232" class="item">queries registered on the view</text>
  <text x="560" y="249" class="small">the mask carried into their answer,</text>
  <text x="560" y="266" class="small">the narrowing in their fingerprint</text>
  <text x="544" y="292" class="item">alerts, evaluated as their owner</text>
  <text x="544" y="318" class="small">A REVOKE ends an open subscription.</text>

  <!-- refusals -->
  <rect x="24" y="354" width="370" height="190" rx="10" fill="#FFFFFF" stroke="#E3DED7"/>
  <text x="40" y="378" class="head">A masked column is never an operand</text>
  <text x="40" y="402" class="mono">WHERE card = '4111…1111'</text>
  <text x="40" y="420" class="mono">GROUP BY card</text>
  <text x="40" y="446" class="code">PRV-7006</text>
  <text x="40" y="472" class="small">Used as a filter, group, join or sort key,</text>
  <text x="40" y="489" class="small">aggregate argument or view key, the true</text>
  <text x="40" y="506" class="small">value would decide which rows appear, and</text>
  <text x="40" y="523" class="small">the result would leak it. So it is refused.</text>

  <rect x="406" y="354" width="370" height="190" rx="10" fill="#FFFFFF" stroke="#E3DED7"/>
  <text x="422" y="378" class="head">A filter that restricts nothing is refused</text>
  <text x="422" y="402" class="mono">region = region</text>
  <text x="422" y="420" class="mono">a &lt; 5 OR a &gt; 2</text>
  <text x="422" y="446" class="code">PRV-7003 · PRV-7038</text>
  <text x="422" y="472" class="small">A grant that reads as a restriction. Decided</text>
  <text x="422" y="489" class="small">region by region over the values a column can</text>
  <text x="422" y="506" class="small">hold: sound, never refusing a real restriction,</text>
  <text x="422" y="523" class="small">and not complete.</text>
</svg>
