<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510">
  <title>The adversarial QA of 2.0.0, and the three waves that fixed what it found</title>
  <style>
    text { font-family: 'Source Sans 3', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1A1A1A; }
    .title { font-family: 'Source Serif 4', 'Charis SIL', Georgia, serif; font-size: 23px; font-weight: 700; }
    .head { font-size: 15px; font-weight: 600; }
    .body { font-size: 14px; }
    .small { font-size: 13px; fill: #4A5058; }
    .big { font-family: 'Source Serif 4', 'Charis SIL', Georgia, serif; font-size: 26px; font-weight: 700; fill: #A51C30; }
    .white { font-size: 15px; font-weight: 600; fill: #FFFFFF; }
    .whitesmall { font-size: 13px; fill: #F6E6E9; }
    .ok { font-size: 13.5px; fill: #1B6B3A; font-weight: 600; }
  </style>
  <defs>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7480"/></marker>
  </defs>
  <rect width="800" height="510" fill="#F7F5F2"/>
  <text x="40" y="44" class="title">Attacking our own release, then fixing it</text>
  <text x="40" y="68" class="small">Adversarial QA of v2.0.0 on JDK 25, 1 October 2026; the fixes, in three waves, done on 2 October.</text>

  <!-- Row 1: the round -->
  <rect x="24" y="88" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#E3DED7"/>
  <text x="42" y="114" class="head">1 · Cases written first</text>
  <text x="42" y="150" class="big">322</text>
  <text x="42" y="174" class="small">each one names the promise</text>
  <text x="42" y="192" class="small">it tries to break; 168 on the</text>
  <text x="42" y="210" class="small">engine, 154 on the surfaces</text>

  <line x1="258" y1="163" x2="282" y2="163" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ai)"/>

  <rect x="285" y="88" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#E3DED7"/>
  <text x="303" y="114" class="head">2 · Run, verdicts logged</text>
  <text x="303" y="150" class="big">244 / 66</text>
  <text x="303" y="174" class="small">passed / failed; 12 blocked or</text>
  <text x="303" y="192" class="small">not run, each with its reason;</text>
  <text x="303" y="210" class="small">no product code changed</text>

  <line x1="519" y1="163" x2="543" y2="163" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ai)"/>

  <rect x="546" y="88" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.5"/>
  <text x="564" y="114" class="head">3 · Findings, reproduced</text>
  <text x="564" y="150" class="big">46 + 4</text>
  <text x="564" y="174" class="small">defects (10 high, 17 medium,</text>
  <text x="564" y="192" class="small">19 low) and design notes;</text>
  <text x="564" y="210" class="small">each defect, a failing test</text>

  <!-- Down into the waves -->
  <path d="M661,242 L661,262 L120,262 L120,280" fill="none" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ai)"/>

  <!-- Row 2: the waves -->
  <rect x="24" y="284" width="180" height="110" rx="10" fill="#A51C30"/>
  <text x="40" y="310" class="white">Wave 1 · the ten high</text>
  <text x="40" y="334" class="whitesmall">aggregates, integers,</text>
  <text x="40" y="352" class="whitesmall">journal, shared state,</text>
  <text x="40" y="370" class="whitesmall">heap, credentials, CDC</text>

  <line x1="208" y1="339" x2="222" y2="339" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ai)"/>

  <rect x="225" y="284" width="180" height="110" rx="10" fill="#8A1626"/>
  <text x="241" y="310" class="white">Wave 2 · seventeen</text>
  <text x="241" y="334" class="whitesmall">casts, checksums, NaN</text>
  <text x="241" y="352" class="whitesmall">groups, hop alignment,</text>
  <text x="241" y="370" class="whitesmall">dead letters, lockout</text>

  <line x1="409" y1="339" x2="423" y2="339" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ai)"/>

  <rect x="426" y="284" width="180" height="110" rx="10" fill="#6E1120"/>
  <text x="442" y="310" class="white">Wave 3 · nineteen + 4</text>
  <text x="442" y="334" class="whitesmall">codes, probes, cookies,</text>
  <text x="442" y="352" class="whitesmall">headers, Helm names,</text>
  <text x="442" y="370" class="whitesmall">the four design notes</text>

  <line x1="610" y1="339" x2="624" y2="339" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ai)"/>

  <rect x="627" y="284" width="149" height="110" rx="10" fill="#FFFFFF" stroke="#1B6B3A" stroke-width="1.5"/>
  <text x="643" y="310" class="head">The register</text>
  <text x="643" y="340" class="big" style="fill:#1B6B3A">0 open</text>
  <text x="643" y="362" class="small">544 findings;</text>
  <text x="643" y="380" class="small">3 more found fixing</text>

  <!-- What held -->
  <rect x="24" y="412" width="752" height="80" rx="10" fill="#F6E6E9"/>
  <text x="42" y="436" class="head">What held, against an independent oracle</text>
  <text x="42" y="460" class="body">420 seeded window runs · 40 × 150 chained steps · 19 SIGKILLs, nothing lost or doubled ·</text>
  <text x="42" y="478" class="body">9,800 random predicates, interpreted = generated · masks, row filters and tenant walls</text>
</svg>
