#
# pravaha-it's HelpExamplesSqlTest reads this file, declares each stream exactly as a node would
# (the `name:TYPE` grammar of pravaha.streams.*.schema, `?` for nullable, the event-time column and
# the out-of-orderness), and plans every ```sql block under console/content/topics/ against it
# through the same planner and plan builder POST /api/v1/queries/validate uses. A help page whose
# SQL stops planning fails the build, exactly as a case study's does (CaseStudySqlTest).
#
# role: source (consumed; advances event time) or lookup (asked, for FOR SYSTEM_TIME AS OF joins).

# Card payments -- the stream most of the documentation already uses.
stream.txn.role=source
stream.txn.fields=txn_id:INT64,user_id:STRING,merchant:STRING,amount:INT64,currency:STRING,status:STRING?,event_time:TIMESTAMP
stream.txn.event-time=event_time
stream.txn.out-of-orderness=PT10S

# Orders and their shipments: two streams, for time-bounded stream-to-stream joins.
stream.orders.role=source
stream.orders.fields=order_id:INT64,customer_id:STRING,region:STRING,amount:INT64,status:STRING,event_time:TIMESTAMP
stream.orders.event-time=event_time
stream.orders.out-of-orderness=PT30S

stream.shipments.role=source
stream.shipments.fields=shipment_id:INT64,order_id:INT64,carrier:STRING,event_time:TIMESTAMP
stream.shipments.event-time=event_time
stream.shipments.out-of-orderness=PT30S

# Trading: executions and quotes. Prices are integer cents -- SUM over a float is refused.
stream.trades.role=source
stream.trades.fields=trade_id:INT64,account:STRING,symbol:STRING,side:STRING,qty:INT64,price_cents:INT64,event_time:TIMESTAMP
stream.trades.event-time=event_time
stream.trades.out-of-orderness=PT5S

stream.quotes.role=source
stream.quotes.fields=symbol:STRING,bid_cents:INT64,ask_cents:INT64,event_time:TIMESTAMP
stream.quotes.event-time=event_time
stream.quotes.out-of-orderness=PT5S

# Sensor telemetry, with a floating-point reading and a nullable column.
stream.readings.role=source
stream.readings.fields=device_id:STRING,site:STRING,temperature:FLOAT64,battery_pct:INT32?,event_time:TIMESTAMP
stream.readings.event-time=event_time
stream.readings.out-of-orderness=PT1M

# Dimension tables, asked as of each row's event time.
stream.user_profile.role=lookup
stream.user_profile.fields=user_id:STRING,tier:STRING,region:STRING

stream.customers.role=lookup
stream.customers.fields=customer_id:STRING,segment:STRING,country:STRING

stream.instruments.role=lookup
stream.instruments.fields=symbol:STRING,sector:STRING,lot_size:INT64
