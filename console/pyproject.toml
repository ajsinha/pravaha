[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pravaha-console"
version = "2.2.1"
description = "Operator console for Project Pravaha. A separate process, built on the published SDK."
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ashutosh Sinha", email = "ajsinha@gmail.com" }]
# Said in the metadata as well as the file, as the SDK says it: a wheel's classifiers are what
# an index and a dependency scanner read, and this project is not open source (LIC-1).
classifiers = ["License :: Other/Proprietary License"]

# The console is the first real consumer of the Python SDK, which is the second reason ADR-024
# chose Python for it: an integrator's experience of the client is our experience of it.
dependencies = [
  "pyyaml>=6",
  "jinja2>=3.1",
  "markdown>=3.5",
  "pygments>=2.17",
  "pravaha[flight]",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  # FastAPI parses HTML form posts through this. Without it every form in the console fails
  # at request time with an import error, which is a dependency mistake that only shows up
  # when somebody presses a button.
  "python-multipart>=0.0.9",
  # Signs the session cookie the console's sign-in writes into.
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.16,<0.17", "mypy>=2.3,<2.4",
       # Stubs, so the type check covers the config loader and the content library
       # rather than skipping them for want of a declaration.
       "types-PyYAML", "types-Markdown"]

[project.scripts]
pravaha-console = "run_pravaha_web:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "routes"]
# The templates, the vendored assets and the content ship inside the artefact.
# ADR-033: running the console is one command against one artefact, and a wheel
# that leaves the stylesheet behind is not that.
artifacts = ["web/**", "content/**", "config/**", "run_pravaha_web.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: drives a real headless Chrome over the DevTools protocol; skips when none is installed (PRAVAHA_CHROME, PRAVAHA_BROWSER_TESTS=0)",
]

[tool.ruff]
# Written to about 110 columns; ruff's default of 88 reported lines nobody had chosen to wrap
# (CONSOLERUFF-1).
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Named rather than inherited, as the SDK names its own: ruff widens its default rule set between
# releases, and a lint that changes under code nobody touched is not a lint anyone can hold.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture shared by importing it is then "redefined" by every test that takes it as a
# parameter, which is how a fixture is used; F811 reads that as a mistake.
"tests/*" = ["F811", "E402"]
# The entry point and the tests put the console's root on sys.path before importing from it, so
# they run from a checkout without an install; an import after that line is the point, not a slip.
"run_pravaha_web.py" = ["E402"]

