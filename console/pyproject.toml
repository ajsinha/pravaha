[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pravaha-console"
version = "0.1.0"
description = "Operator console for Project Pravaha. A separate process, built on the published SDK."
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ashutosh Sinha", email = "ajsinha@gmail.com" }]

# The console is the first real consumer of the Python SDK, which is the second reason ADR-024
# chose Python for it: an integrator's experience of the client is our experience of it.
dependencies = [
  "pravaha[flight]",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  # FastAPI parses HTML form posts through this. Without it every form in the console fails
  # at request time with an import error, which is a dependency mistake that only shows up
  # when somebody presses a button.
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
pravaha-console = "pravaha_console.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pravaha_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
