# ==========================================================================
# ${VAR} and ${VAR:default} substitution resolves against other keys in this
# file, environment variables, and command-line --key=value overrides.
# Values are read as strings and coerced on access (get_int / get_bool /
# get_list), so `port: 17070` and `port: "${PORT:17070}"` behave identically.
#
# Secrets do NOT belong here: this file is tracked. Put them in
# config/application.local.yaml, a git-ignored overlay loaded straight after
# this file, which sets only the keys it names.
# ==========================================================================

app:
  name: Pravaha
  tagline: Ask once. Answer always.
  slogan: One question, one computation.
  # The claim the whole engine makes, carried in the footer of every page.
  # Held here rather than typed into a template, because it is already quoted
  # in the README and the design document, and a sentence kept in three places
  # is a sentence that ends up saying three things.
  principle: A view is a question you asked once and never have to ask again.
  version: "0.2.1"
  author:
    name: Ashutosh Sinha
    email: ajsinha@gmail.com
  copyright:
    years: "2026"
    holder: Ashutosh Sinha

# Signing in (ADR-052). The engine is the identity authority: a person signs in with the
# username and password the engine holds for them, the console keeps the engine session token
# it answers with in a signed cookie, and every engine call it makes for that person carries
# that token. The console has no password of its own and no engine token of its own -- a new
# person, a password reset or an API key is administered in the engine (Admin · Users here,
# `pravaha user` on the command line, or its REST API).
console:
  # Mark the session cookie Secure always. Without this it is Secure exactly when the request
  # reached the console over https, which is right unless a proxy terminates TLS and forwards
  # plain http without saying so (run uvicorn with --proxy-headers so it can).
  secure_cookies: "${CONSOLE_SECURE_COOKIES:false}"
  # Signs the session cookie. Empty means one is generated at startup, which is fine for a
  # single instance and logs everybody out on restart; set it to share sessions across
  # instances or to survive a restart.
  session_secret: "${CONSOLE_SESSION_SECRET:}"

server:
  host: "${CONSOLE_HOST:127.0.0.1}"
  port: "${CONSOLE_PORT:17070}"
  reload: false

# The engine this console is pointed at. One engine, deliberately: the console
# is an operator tool with one server in view, and a pool would add a failure
# mode nobody is watching for concurrency nobody needs at this scale.
engine:
  url: "${PRAVAHA_ENGINE:grpc://localhost:19090}"
  # No token: the console calls the engine as the person signed in, with their own engine
  # session (ADR-052). `engine.token` is no longer read.
  # How long a health answer is reused. The overview polls it, and every browser
  # asking the engine directly would make the health check a load source of its
  # own -- which is the failure where monitoring takes down what it monitors.
  health_cache_seconds: 1
  # The engine's HTTP surface: its public REST API (/api/v1/streams, /api/v1/queries/validate,
  # /api/v1/queries/explain, /api/v1/status) and /actuator/prometheus. The workbench's
  # catalog, validation and plans, and the operations dashboard, read it. A separate port
  # from Flight -- 18080, not 19090.
  http_url: "${PRAVAHA_ENGINE_HTTP:http://localhost:18080}"
  # Where psql reaches the engine's PostgreSQL gateway, for the view browser's snippets.
  # Only ever shown as text; the console does not connect to it.
  pgwire: "${PRAVAHA_PGWIRE:localhost:5432}"

ui:
  # Rows buffered per browser on a live tail before the oldest are dropped. A
  # live view is about what is true now, so the row a reader has not caught up
  # to matters less than the one that just arrived.
  tail_buffer: 256
  # Rows a one-off query may return to a browser. A query matching a million
  # rows should not be able to make the console the reason a tab dies.
  query_row_limit: 500
  page_size: 25
  # The UI string catalog, web/i18n/<language>.json. Only "en" exists; an unknown
  # language falls back to it rather than rendering keys.
  language: ${CONSOLE_LANGUAGE:en}
  # A watermark further behind the wall clock than this is a finding on the operations
  # dashboard: the data is late, or its source has stopped.
  lag_warn_seconds: 300
  # Where a signed-in person lands when they have not chosen: analyst (workbench),
  # operator (operations dashboard) or developer (views). Each person can change their own
  # from the account menu or their account page, and it is remembered for them on that
  # browser; this is only the default. It picks a screen, never a permission.
  default_role: "${CONSOLE_DEFAULT_ROLE:operator}"
  # /_components: every design-system component and the eight states of design 23.12 on one
  # page, rendered by the console itself -- the no-build stand-in for Storybook, for whoever
  # is changing the look. Off in a deployment (404), and behind the sign-in when on.
  component_gallery: ${CONSOLE_COMPONENT_GALLERY:false}

api:
  prefix: "/api/v1"

# The assistant (ADR-058): plain English to and from continuous SQL, through the models an
# administrator configures in Admin · AI models. The configuration is the SDK's JSON file, shared
# with `pravaha assist`; the console follows it, so a change made there or here is used by the
# next request without a restart. No key is ever in it -- only the name of the variable or file.
assist:
  # Empty: $PRAVAHA_ASSIST_CONFIG, else assist.json in $PRAVAHA_CONFIG_DIR or ~/.config/pravaha.
  config: "${PRAVAHA_ASSIST_CONFIG:}"
  # The usage ledger the per-person daily budget counts against. Empty: assist-usage.json
  # beside the configuration -- the same file `pravaha assist` uses there.
  usage: "${PRAVAHA_ASSIST_USAGE:}"
  # The console's assist log (JSON Lines): every configuration change with who made it and what
  # it was before and after, and every request with who, which model, tokens and the verdict.
  # Empty: console-assist-log.jsonl beside the configuration.
  log: "${PRAVAHA_ASSIST_LOG:}"
  # How often the console looks for a change another process stored.
  watch_seconds: 1

# Where the help, the tutorials and About read their text. Empty: the content/ directory shipped
# with the console, and the repository (or installation) it sits in for README, docs/ and
# examples/case-studies/. Nothing needs to set these; the visual tests do, to photograph pages over
# fixed text (ABOUTBASE-1).
content:
  root: ""
  repository: ""

logging:
  level: "${LOG_LEVEL:INFO}"
  # text: a pattern for a person reading a terminal. json: one JSON object per line -- @timestamp,
  # level, logger, thread, message, the request's correlationId, and traceId/spanId when
  # OpenTelemetry is installed and tracing -- for Loki or Elasticsearch. Anything else refuses the start.
  format: "${CONSOLE_LOG_FORMAT:text}"
  # Also write the log to this file, rotated past max_bytes keeping `backups` generations. Empty:
  # standard error only. The console image sets CONSOLE_LOG_FILE=/opt/pravaha/logs/pravaha-console.log.
  file: "${CONSOLE_LOG_FILE:}"
  max_bytes: 52428800
  backups: 10

# The assistant's metrics for Prometheus at /metrics: requests, tokens, failures, fallbacks and
# latency per model and profile, and today's tokens from the usage ledger. OFF by default: it names
# the models configured and how much each is used. Gated by configuration rather than a sign-in,
# because the caller is a scraper with no session. With a token set, a scrape must send it as a
# bearer (Prometheus: authorization: {credentials: ...}); without one, anyone who can reach the
# console can read it, which the console says at startup. Keep the token in application.local.yaml
# or the environment, never in this file.
metrics:
  enabled: "${CONSOLE_METRICS_ENABLED:false}"
  token: "${CONSOLE_METRICS_TOKEN:}"
