    <stop offset="0" stop-color="#2E7FD0"/><stop offset="1" stop-color="#12447A"/>
  </linearGradient></defs>
  <rect width="64" height="64" rx="14" fill="url(#f)"/>
  <path d="M10 24c8-6 14 6 22 0s14 6 22 0" fill="none" stroke="#fff"
