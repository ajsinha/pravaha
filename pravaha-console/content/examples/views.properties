# Each is a continuous query over streams.properties: view.<name> is its SELECT, and
# view.<name>.keys its KEYED BY columns. HelpExamplesSqlTest plans each one, registers the view it
# maintains, and prepares every `<!-- sql: read -->` example against them through ViewQuery -- the
# path a point read or a pgwire SELECT takes. A page may also read a view that one of its own
# CREATE CONTINUOUS QUERY examples creates; those are added for that page only.

view.hourly_spend=SELECT user_id, window_start, window_end, SUM(amount) AS spend FROM TABLE(TUMBLE(TABLE txn, DESCRIPTOR(event_time), INTERVAL '1' HOUR)) GROUP BY user_id, window_start, window_end
view.hourly_spend.keys=user_id,window_end

view.big_txn=SELECT txn_id, user_id, merchant, amount FROM txn WHERE amount > 1000
view.big_txn.keys=txn_id

view.user_volume=SELECT t.user_id, p.tier, window_start, window_end, SUM(t.amount) AS total, COUNT(*) AS txn_count FROM TABLE(TUMBLE(TABLE txn, DESCRIPTOR(event_time), INTERVAL '1' HOUR)) AS t LEFT JOIN user_profile FOR SYSTEM_TIME AS OF t.event_time AS p ON p.user_id = t.user_id GROUP BY t.user_id, p.tier, window_start, window_end
view.user_volume.keys=user_id,window_end

view.region_revenue=SELECT region, window_start, window_end, SUM(amount) AS revenue, COUNT(*) AS orders FROM TABLE(TUMBLE(TABLE orders, DESCRIPTOR(event_time), INTERVAL '5' MINUTE)) GROUP BY region, window_start, window_end
view.region_revenue.keys=region,window_end

view.symbol_volume=SELECT symbol, window_start, window_end, SUM(qty) AS shares, SUM(qty * price_cents) AS notional_cents, COUNT(*) AS fills FROM TABLE(TUMBLE(TABLE trades, DESCRIPTOR(event_time), INTERVAL '1' MINUTE)) GROUP BY symbol, window_start, window_end
view.symbol_volume.keys=symbol,window_end
